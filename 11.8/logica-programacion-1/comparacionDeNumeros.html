<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ordenar 3 números</title>
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
  h1 { font-size: 1.4rem; }
  button { padding: 8px 16px; font-size: 1rem; cursor: pointer; margin-top: 10px; }
  #resultado { margin-top: 20px; padding: 15px; background: #f4f4f4; border-radius: 6px; white-space: pre-line; }
</style>
</head>
<body>

<h1>Analizador de 3 números</h1>
<h2>Luis Angel Hernández Martínez</h2>
<p>Presiona el botón para ingresar 3 números (se pedirán por prompt).</p>
<button onclick="ejecutarPrograma()">Ingresar números</button>

<div id="resultado"></div>

<script>
  function ejecutarPrograma() {
    // 1. Solicitar los 3 números al usuario
    const num1 = Number(prompt("Ingresa el primer número:"));
    const num2 = Number(prompt("Ingresa el segundo número:"));
    const num3 = Number(prompt("Ingresa el tercer número:"));

    if (isNaN(num1) || isNaN(num2) || isNaN(num3)) {
      mostrar("Por favor ingresa solo valores numéricos.");
      return;
    }

    // 2. Identificar mayor, menor y del centro usando Math.max / Math.min
    const mayor = Math.max(num1, num2, num3);
    const menor = Math.min(num1, num2, num3);

    // El del centro es el que no es ni el mayor ni el menor.
    // Ordenamos el arreglo original para encontrarlo de forma segura (funciona también con repetidos).
    const numeros = [num1, num2, num3];
    const ordenAscendente = [...numeros].sort((a, b) => a - b);
    const ordenDescendente = [...numeros].sort((a, b) => b - a);
    const centro = ordenAscendente[1];

    // 3. Armar los mensajes de salida
    let salida = "";
    salida += "Números ingresados: " + numeros.join(", ") + "\n";
    salida += "Mayor: " + mayor + "\n";
    salida += "Centro: " + centro + "\n";
    salida += "Menor: " + menor + "\n";
    salida += "\nOrdenado de mayor a menor: " + ordenDescendente.join(", ") + "\n";
    salida += "Ordenado de menor a mayor: " + ordenAscendente.join(", ") + "\n";

    // 4. Verificar si los 3 números son iguales
    if (num1 === num2 && num2 === num3) {
      salida += "\nLos números son iguales.";
    }

    // Imprimir por consola
    console.log(salida);

    // Imprimir por el DOM
    mostrar(salida);
  }

  function mostrar(texto) {
    document.getElementById("resultado").textContent = texto;
  }
</script>

</body>
</html>
